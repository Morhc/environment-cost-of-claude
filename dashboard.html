<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Environment Cost of Claude</title>
<style>
  :root{
    --surface:#fcfcfb; --raised:#f6f5f1; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
    --grid:#e1e0d9; --base:#c3c2b7;
    --blue:#2a78d6; --orange:#eb6834; --aqua:#1baf7a; --blue-d:#184f95; --blue-l:#86b6ef;
  }
  :root:not([data-theme="light"]){ }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --surface:#16161a; --raised:#1e1e23; --ink:#f4f4f2; --ink2:#c9c8c3; --muted:#8d8c87;
      --grid:#2c2c32; --base:#3a3a41;
      --blue:#5598e7; --orange:#f08055; --aqua:#3ec394; --blue-d:#86b6ef; --blue-l:#2a5f9e;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--surface);color:var(--ink);
       font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
  header{padding:20px 26px 0;display:flex;align-items:flex-start;gap:18px;flex-wrap:wrap}
  h1{font-size:19px;margin:0 0 2px}
  .sub{color:var(--muted);font-size:12.5px}
  .spacer{flex:1}
  button{font:inherit;border:1px solid var(--base);background:var(--raised);color:var(--ink);
         border-radius:7px;padding:7px 13px;cursor:pointer}
  button:hover{border-color:var(--blue)}
  button:disabled{opacity:.55;cursor:progress}
  .primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
  nav{display:flex;gap:2px;padding:16px 26px 0;border-bottom:1px solid var(--grid);flex-wrap:wrap}
  nav button{border:none;background:none;border-bottom:2px solid transparent;border-radius:0;
             padding:9px 14px;color:var(--ink2)}
  nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--blue);font-weight:600}
  main{padding:22px 26px 60px;max-width:1100px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px}
  .tile{background:var(--raised);border:1px solid var(--grid);border-radius:11px;padding:15px 17px}
  .tile .lab{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
  .tile .val{font-size:27px;font-weight:650;margin:5px 0 1px;letter-spacing:-.01em}
  .tile .sub2{color:var(--ink2);font-size:12.5px}
  .row{display:flex;align-items:center;gap:11px;margin:15px 0;flex-wrap:wrap}
  select{font:inherit;padding:6px 9px;border-radius:7px;border:1px solid var(--base);
          background:var(--raised);color:var(--ink)}
  table{border-collapse:collapse;width:100%;margin-top:8px;font-size:13.5px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--grid)}
  th{color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;
     letter-spacing:.04em}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
  .bar{height:9px;border-radius:4px;background:var(--blue);min-width:2px}
  .barwrap{background:var(--grid);border-radius:4px;overflow:hidden;width:100%}
  .path{color:var(--muted);font-size:11.5px;word-break:break-all}
  .note{color:var(--ink2);font-size:12.5px;margin-top:16px;line-height:1.55;
        border-left:2px solid var(--grid);padding-left:12px}
  .err{border-left-color:var(--orange);color:var(--orange)}
  .legend{display:flex;gap:16px;font-size:12px;color:var(--ink2);margin:4px 0 10px}
  .sw{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;
      margin-right:5px}
  [hidden]{display:none !important}
  .scroll{overflow-x:auto}
  tr[data-tip]{cursor:default}
  #tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--surface);
       padding:6px 9px;border-radius:6px;font-size:12px;opacity:0;transition:opacity .1s;
       z-index:9;max-width:320px}
</style>
</head>
<body>
<header>
  <div>
    <h1>Environment Cost of Claude</h1>
    <div class="sub" id="stamp">loading…</div>
  </div>
  <div class="spacer"></div>
  <button class="primary" id="refresh">Refresh data</button>
</header>

<nav role="tablist">
  <button role="tab" aria-selected="true" data-tab="cost">Environmental cost</button>
  <button role="tab" aria-selected="false" data-tab="sources">Sources</button>
  <button role="tab" aria-selected="false" data-tab="projects">Projects</button>
</nav>

<main>
  <section id="cost">
    <div class="row">
      <label>Grid convention
        <select id="grid"></select>
      </label>
      <label>Show
        <select id="mode">
          <option value="real">Real units</option>
          <option value="equiv">Everyday equivalents</option>
        </select>
      </label>
    </div>
    <div class="tiles" id="tiles"></div>
    <div class="note" id="costnote"></div>
  </section>

  <section id="sources" hidden>
    <div class="sub" style="margin-bottom:12px">
      Claude Code keeps transcripts per machine with no central ledger, so anything not collected
      here is simply missing from the total.
    </div>
    <div class="scroll"><table id="srctable"></table></div>
    <div class="note" id="srcnote"></div>
  </section>

  <section id="projects" hidden>
    <div class="sub" style="margin-bottom:12px">
      Projects accounting for <strong>5% or more</strong> of total energy, with where they live.
      Everything below the threshold is pooled into one row.
    </div>
    <div class="scroll"><table id="projtable"></table></div>
    <div class="note" id="projnote"></div>
  </section>
</main>
<div id="tip"></div>

<script>
const $ = s => document.querySelector(s);
let D = null;

const fmt = (n, d = 0) => n.toLocaleString(undefined, {minimumFractionDigits: d,
                                                      maximumFractionDigits: d});
const pct = x => (x * 100).toFixed(1) + '%';

// ---- tabs -------------------------------------------------------------------------------
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x =>
    x.setAttribute('aria-selected', x === b));
  ['cost', 'sources', 'projects'].forEach(id => $('#' + id).hidden = (id !== b.dataset.tab));
});

// ---- hover tooltips ---------------------------------------------------------------------
const tip = $('#tip');
document.addEventListener('mousemove', e => {
  const el = e.target.closest('[data-tip]');
  if (!el) { tip.style.opacity = 0; return; }
  tip.textContent = el.dataset.tip;
  tip.style.opacity = 1;
  tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 10) + 'px';
  tip.style.top = (e.clientY + 18) + 'px';
});

// ---- rendering --------------------------------------------------------------------------
function tiles() {
  const g = +$('#grid').value, kwh = D.totals.kwh, eq = D.equivalences;
  const co2 = kwh * g / 1000;                       // kg
  const wOn = kwh * D.water.on_site_l_per_kwh, wTot = kwh * D.water.total_l_per_kwh;
  const real = [
    ['Energy', fmt(kwh, 1) + ' kWh', `${fmt(D.totals.sessions)} sessions · ` +
      `${fmt(D.totals.messages)} assistant messages`],
    ['CO₂', fmt(co2, 1) + ' kg', `at ${$('#grid').selectedOptions[0].textContent}`],
    ['Water', fmt(wTot, 0) + ' L', `${fmt(wOn, 0)} L on-site cooling; the rest evaporates at the ` +
      `power plants`],
  ];
  const equiv = [
    ['Energy', fmt(kwh * eq.energy.household_days_per_kwh, 1) + ' household-days',
      `or ${fmt(kwh * eq.energy.ev_km_per_kwh, 0)} km in an electric car`],
    ['CO₂', fmt(co2 * eq.co2.miles_driven_per_kg * 1.609, 0) + ' km driven',
      `or ${fmt(co2 / (eq.flight.kgco2e_per_passenger_km * eq.flight.reference_route_km), 2)} ` +
      `long-haul flights · ${fmt(co2 * eq.co2.tree_seedlings_10yr_per_kg, 1)} tree-seedlings ` +
      `grown 10 years`],
    ['Water', fmt(wTot / eq.water.litres_per_shower, 0) + ' showers',
      `or ${fmt(wTot / eq.water.litres_per_toilet_flush, 0)} toilet flushes · ` +
      `${fmt(wTot / eq.water.litres_per_bottle, 0)} half-litre bottles`],
  ];
  const rows = $('#mode').value === 'real' ? real : equiv;
  $('#tiles').innerHTML = rows.map(([l, v, s]) =>
    `<div class="tile"><div class="lab">${l}</div><div class="val">${v}</div>
     <div class="sub2">${s}</div></div>`).join('');

  const vals = Object.values(D.grids), lo = Math.min(...vals), hi = Math.max(...vals);
  $('#costnote').innerHTML =
    `Token counts are <strong>measured</strong>. Energy, CO₂ and water are <strong>derived</strong>
     from published per-token rates carrying 2–4× method uncertainty. Across the
     ${Object.keys(D.grids).length} accounting conventions loaded here the same electricity spans
     <strong>${fmt(kwh * lo / 1000, 0)}–${fmt(kwh * hi / 1000, 0)} kg CO₂</strong>, a factor of
     ${(hi / lo).toFixed(1)} from the choice of convention alone — wider than the rate uncertainty.
     Equivalence factors are EPA and DEFRA published values; the shower duration and EV efficiency
     are stated assumptions. See the report for provenance.`;
}

function bartable(el, rows, note) {
  const max = Math.max(...rows.map(r => r.wh), 1);
  el.innerHTML = `<thead><tr><th>${rows.label || 'Name'}</th><th class="n">kWh</th>
      <th class="n">Share</th><th style="width:34%">&nbsp;</th></tr></thead><tbody>` +
    rows.map(r => `<tr data-tip="${r.tip}">
      <td>${r.name}${r.sub ? `<div class="path">${r.sub}</div>` : ''}</td>
      <td class="n">${fmt(r.wh / 1000, 1)}</td>
      <td class="n">${pct(r.share)}</td>
      <td><div class="barwrap"><div class="bar" style="width:${(r.wh / max * 100).toFixed(1)}%;
           background:${r.color || 'var(--blue)'}"></div></div></td></tr>`).join('') +
    '</tbody>';
}

function render() {
  $('#stamp').textContent =
    `${fmt(D.totals.kwh, 1)} kWh · ${D.totals.sessions} sessions · ` +
    `${(D.totals.first || '').slice(0, 10)} to ${(D.totals.last || '').slice(0, 10)} · ` +
    `collected ${D.generated}`;

  if (!$('#grid').options.length) {
    const entries = Object.entries(D.grids).sort((a, b) => a[1] - b[1]);
    $('#grid').innerHTML = entries.map(([k, v]) =>
      `<option value="${v}"${k === 'eGRID_US_avg' ? ' selected' : ''}>` +
      `${k.replace(/_/g, ' ')} — ${v.toFixed(0)} g/kWh</option>`).join('');
  }
  tiles();

  const g = +$('#grid').value;
  bartable($('#srctable'), D.sources.map(s => ({
    name: s.source, sub: s.roots.join('<br>'), wh: s.wh, share: s.share,
    tip: `${s.sessions} sessions · ${fmt(s.messages)} messages · ` +
         `${fmt(s.wh / 1000 * g / 1000, 1)} kg CO₂`,
  })), );
  $('#srcnote').innerHTML = D.sources.length < 2
    ? `Only one source is configured, so this total is a <strong>lower bound</strong>. Add remote
       hosts to <code>sources.json</code> and press Refresh — for this project's author a
       laptop-only figure missed 62% of the real total.`
    : `${D.sources.length} sources merged. Anything you run Claude Code on that is not listed here
       is missing from every number in this dashboard. Cloud sessions are never written to local
       disk and cannot be collected at all.`;

  const big = D.projects.filter(p => p.share >= D.threshold);
  const rest = D.projects.filter(p => p.share < D.threshold);
  const rows = big.map(p => ({
    name: p.project, sub: `${p.source} · ${p.root}`, wh: p.wh, share: p.share,
    tip: `${p.sessions} sessions · ${fmt(p.messages)} messages · ` +
         `${fmt(p.wh / 1000 * g / 1000, 1)} kg CO₂`,
  }));
  if (rest.length) {
    const wh = rest.reduce((a, p) => a + p.wh, 0);
    rows.push({name: `${rest.length} smaller projects`, sub: 'each below the 5% threshold',
               wh, share: wh / (D.totals.kwh * 1000), color: 'var(--base)',
               tip: `${rest.length} projects pooled`});
  }
  bartable($('#projtable'), rows);
  $('#projnote').innerHTML = big.length
    ? `${big.length} project${big.length > 1 ? 's' : ''} clear the 5% threshold and account for
       <strong>${pct(big.reduce((a, p) => a + p.share, 0))}</strong> of total energy.`
    : 'No single project reaches 5% — usage is spread evenly.';

  $('#costnote').insertAdjacentHTML('afterend', '');
  if (D.errors && D.errors.length) {
    document.querySelectorAll('.err').forEach(e => e.remove());
    $('main').insertAdjacentHTML('afterbegin',
      `<div class="note err">Collection problems: ${D.errors.join(' · ')}</div>`);
  }
}

async function load(url) {
  const btn = $('#refresh');
  btn.disabled = true;
  const was = btn.textContent;
  btn.textContent = url.includes('refresh') ? 'Collecting…' : 'Loading…';
  try {
    const r = await fetch(url);
    D = await r.json();
    if (D.error) throw new Error(D.error);
    render();
  } catch (e) {
    $('#stamp').textContent = 'failed: ' + e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = was;
  }
}

$('#refresh').onclick = () => load('/api/refresh');
$('#grid').onchange = render;
$('#mode').onchange = tiles;
load('/api/data');
</script>
</body>
</html>
